<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Setup')}"></head>
<body>
<header th:replace="~{layout :: topbar}"></header>

<main class="wrap">
    <h1 class="page-title">Pick the artists you love</h1>
    <p class="page-sub">
        Ten is enough to start — add as many as you like. This list lives on your account, so it works
        for every festival, not just this one.
    </p>

    <!-- Searching the whole corpus, not just the artists already tagged. An
         artist nobody has tagged gets them fetched from MusicBrainz when they
         are saved, which is what makes offering all of them honest. The page
         does not mention any of that: whether we hold tags for an artist is
         our problem, and telling someone their pick needs fetching invites
         them to worry about it. -->
    <form method="get" th:action="@{/setup}" class="form-narrow">
        <p>
            <input type="search" name="q" th:value="${q}" placeholder="Find an artist…"
                   style="min-width:18rem">
            <button type="submit" class="button-quiet">Search</button>
            <a th:href="@{/setup}" class="button-quiet" th:if="${searching}">Clear</a>
        </p>
    </form>

    <p class="muted" th:if="${searching}">
        <span th:text="${#lists.size(choices)}">0</span> matching artists.
        Tick the ones you love and save.
    </p>

    <form method="post" th:action="@{/setup}">
        <input type="hidden" name="artistIds" th:each="id : ${keep}" th:value="${id}"/>
        <p>
            <button type="submit" class="btn">Save my artists</button>
            <span class="muted">Currently saved: <span th:text="${chosenCount}">0</span></span>
        </p>

        <div class="grid grid-2">
            <label class="card" th:each="c : ${choices}">
                <div class="name">
                    <input type="checkbox" name="artistIds" th:value="${c.artistId}" th:checked="${c.chosen}"/>
                    <span th:text="${c.name}">Artist</span>
                </div>
                <div class="tags" th:text="${c.tags}">tags</div>
            </label>
        </div>

        <p><button type="submit" class="btn">Save my artists</button></p>
    </form>
</main>
</body>
</html>
